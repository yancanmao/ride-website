<text x="122" y="619" class="label" text-anchor="start">研究候选 · READY 位置资格通过 / 非默认</text>
<text x="122" y="650" class="body" text-anchor="start">真实释放账本  +  READY 放行 / 恢复位置</text>
<text x="122" y="675" class="small" text-anchor="start">TOOL 预取 / CPU 保留 / 重算决策未接通；性能待验。</text>
