<text x="920" y="67" class="label" text-anchor="start">SWE-smith 轨迹回放</text>
<text x="1345" y="67" class="small" text-anchor="end">客户端</text>
<rect x="60" y="125" width="1320" height="124" rx="7" fill="#f7f9fc" stroke="#bcc8d6" stroke-width="1.6"/>
<text x="84" y="159" class="title" text-anchor="start">服务管理层</text>
