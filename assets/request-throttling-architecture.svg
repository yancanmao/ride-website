<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
<title id="title">Request Throttling：控制面、请求执行与 Ray 底座</title>
<desc id="desc">顶部为多轮工作负载，管理层含 RIDE 和 ECPA；中部为默认 Controller 与 vLLM 的请求和观测闭环；Controller 内虚线区域为非默认的研究候选，READY放行与恢复位置已通过受控资格，完整联合策略仍未完成；最底部 Ray 承载服务进程。旧五阶段封装不在默认路径。</desc>
<defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2563a6"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#ad4d3b"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#68788d"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1e293b} .title{font-size:25px;font-weight:600}.label{font-size:21px;font-weight:600}.body{font-size:19px}.small{font-size:17px}.note{font-size:18px;fill:#536277}</style>
<rect width="1440" height="980" fill="white"/>
